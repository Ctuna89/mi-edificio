name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          # La versión vive en el archivo VERSION de la raíz
          version=$(tr -d '[:space:]' < VERSION)
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Windows installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          ./instalador/construir.sh

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."; exit 0
          fi
          # notas = la sección "## <versión>" del CHANGELOG.md, sin el título
          awk -v v="$VERSION" '/^## /{ on = (index($0, "## " v) == 1); next } on' CHANGELOG.md > notes.md 2>/dev/null || true
          if [ -s notes.md ]; then
            gh release create "$TAG" dist/*.exe dist/*.sha256 --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.exe dist/*.sha256 --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
